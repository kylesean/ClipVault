# ClipVault 后端服务一键部署
# 用法: docker compose up -d

services:
  # 主解析服务（你的代码）
  parse-service:
    build: ./backend
    ports:
      - "${CLIPVAULT_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      # Cookie 文件持久化
      - ./backend/cookies:/app/cookies
    environment:
      - CLIPVAULT_CORS_ORIGINS=${CLIPVAULT_CORS_ORIGINS:-*}
      - DOUYIN_API_URL=http://douyin-api:80
      - COOKIE_REFRESH_INTERVAL=${COOKIE_REFRESH_INTERVAL:-43200}
      # 设置后所有 /api/cookies 接口与客户端请求需要 X-API-Token 请求头
      - CLIPVAULT_API_TOKEN=${CLIPVAULT_API_TOKEN:-}
    depends_on:
      douyin-api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"

  # 抖音/TikTok/B站解析引擎（Git Submodule）
  # 注意：不对外暴露端口，仅内网（parse-service）可达，缩小攻击面
  douyin-api:
    build: ./backend/douyin_api
    restart: unless-stopped
    volumes:
      # 挂载配置文件，方便更新 Cookie 而不用重建镜像
      - ./backend/douyin_api/crawlers/douyin/web/config.yaml:/app/crawlers/douyin/web/config.yaml
      - ./backend/douyin_api/crawlers/tiktok/web/config.yaml:/app/crawlers/tiktok/web/config.yaml
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
