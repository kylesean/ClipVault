# ClipVault 后端服务一键部署
# 用法: docker compose up -d

services:
  # 解析服务（抖音核心算法已内嵌，无需额外容器）
  parse-service:
    build: ./backend
    ports:
      - "${CLIPVAULT_PORT:-8000}:8000"
    restart: unless-stopped
    volumes:
      # Cookie 文件持久化
      - ./backend/cookies:/app/cookies
    environment:
      - CLIPVAULT_CORS_ORIGINS=${CLIPVAULT_CORS_ORIGINS:-*}
      - COOKIE_REFRESH_INTERVAL=${COOKIE_REFRESH_INTERVAL:-43200}
      # 可选：抖音接口走代理（如 http://127.0.0.1:7890）
      - DOUYIN_PROXY=${DOUYIN_PROXY:-}
      # 设置后所有 /api/cookies 接口与客户端请求需要 X-API-Token 请求头
      - CLIPVAULT_API_TOKEN=${CLIPVAULT_API_TOKEN:-}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
