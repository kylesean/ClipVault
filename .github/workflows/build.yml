name: Build

on:
  push:
    tags:
      - "v*"
    paths:
      - "lib/**"
      - "android/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Prepare Android Release Artifact
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.0.0}"
          cp build/app/outputs/flutter-apk/app-release.apk "ClipVault-${TAG_NAME}-android.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: ClipVault-${{ github.ref_name }}-android.apk
          name: "ClipVault ${{ github.ref_name }}"
          draft: false
          prerelease: false

  ios:
    name: iOS Release (Sideload IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Create IPA for Sideloading
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.0.0}"
          OUTPUT_IPA="ClipVault-${TAG_NAME}-ios-sideload.ipa"

          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "../../../$OUTPUT_IPA" Payload

      - uses: softprops/action-gh-release@v2
        with:
          files: ClipVault-${{ github.ref_name }}-ios-sideload.ipa
          name: "ClipVault ${{ github.ref_name }}"
          draft: false
          prerelease: false
